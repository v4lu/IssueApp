services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_DB: pg
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: pg
    ports:
      - '5432:5432'
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - dev

  cache:
    image: redis:alpine
    ports:
      - '6379:6379'
    networks:
      - dev

  gh-api:
    build:
      context: gh-api
      dockerfile: Dockerfile
    ports:
      - '9001:9001'
    networks:
      - dev

volumes:
  data:

networks:
  dev:
