[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
actix-cors = "0.7.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4.25"
futures = "0.3.31"
argon2 = "0.5.3"
thiserror = "2.0.3"
sqlx = { version = "0.8.2", features = [
  "runtime-tokio",
  "postgres",
  "chrono",
  "uuid",
  "bigdecimal",
] }
uuid = { version = "1.11.0", features = ["serde", "v4"] }
rusty_paseto = { version = "0.7", features = [
  "batteries_included",
  "v4_local",
] }
validator = { version = "0.20.0", features = ["derive"] }
reqwest = { version = "0.12.12", features = [
  "json",
  "rustls-tls",
], default-features = false }
regex = "1.11.1"
